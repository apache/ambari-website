name: Build and Deploy

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: website-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Yarn
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check translations, deployment and types
        run: |
          yarn test:i18n
          yarn test:deployment
          yarn typecheck

      - name: Build all languages
        run: |
          yarn update-avatar
          yarn build

      - name: Test language switching
        run: |
          yarn playwright install --with-deps chromium
          yarn test:e2e

      - name: Prepare ASF publication metadata
        run: cp .asf.yaml build/.asf.yaml

      - name: Upload tested website
        uses: actions/upload-artifact@v4
        with:
          name: website
          path: build/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    if: >-
      github.repository == 'apache/ambari-website' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tested website
        uses: actions/download-artifact@v4
        with:
          name: website
          path: build

      - name: Verify publication metadata
        run: |
          test -f build/.asf.yaml
          test -f build/index.html
          test -f build/zh-Hans/index.html

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: asf-site
          publish_dir: ./build
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Automated deployment:'
